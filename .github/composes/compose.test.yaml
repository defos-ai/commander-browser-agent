services:
  api:
    environment:
      ENV: tests

  fixture:
    image: nginx:alpine
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./tests/fixtures/site:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 2s
      timeout: 2s
      retries: 10
