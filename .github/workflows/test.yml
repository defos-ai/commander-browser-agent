name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test and vet
        env:
          GOWORK: "off"
        run: |
          go mod download
          go test -race -count=1 -timeout=3m ./... ./.github/tests
          go vet -tags=integration ./... ./.github/scripts ./.github/tests

  runtime:
    needs: unit
    name: Runtime / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    env:
      GOWORK: "off"
      PLATFORM: linux/${{ matrix.arch }}
      BROWSER_TEST_AGENT_IMAGE: commander-browser-agent:local
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Commander v0.9.0 publishes the API and controller for amd64.
      - uses: docker/setup-qemu-action@v4
        if: matrix.arch == 'arm64'
        with:
          platforms: amd64
      - uses: docker/setup-buildx-action@v4
        id: builder
        with:
          driver-opts: |
            cpu-period=100000
            cpu-quota=400000
            memory=3500m
            memory-swap=3500m
      - name: Build browser agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ env.PLATFORM }}
          load: true
          tags: ${{ env.BROWSER_TEST_AGENT_IMAGE }}
          cache-from: type=gha,scope=agent-${{ matrix.arch }}
          cache-to: type=gha,scope=agent-${{ matrix.arch }},mode=max
      - name: Stop the image builder
        run: docker buildx stop "${{ steps.builder.outputs.name }}"
      - name: Check packaged browser runtimes
        run: |
          docker run --rm --platform "$PLATFORM" --network none --cpus=2 --memory=2500m --memory-swap=2500m \
            --entrypoint /bin/sh "$BROWSER_TEST_AGENT_IMAGE" -ec '
            test "$(id -u)" = 1000
            "$LIGHTPANDA_PATH" version
            test -s /usr/share/doc/lightpanda/LICENSE
            test -s /usr/share/doc/lightpanda/FONT-LICENSE
            test -s /usr/share/doc/lightpanda/NOTICE
            test -s /usr/share/doc/hermes/LICENSE
            test -s /usr/share/doc/hermes/NOTICE
            test -s /usr/local/lib/python3.14/LICENSE.txt
            /opt/hermes/.venv/bin/python -I -S /usr/local/lib/commander-browser/hermes/check.py
          '
      - name: Run the Commander browser mission
        run: ./scripts/test.sh state/e2e
      - name: Save mission and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-mission-${{ matrix.arch }}
          path: state/e2e/*.log
          if-no-files-found: ignore
